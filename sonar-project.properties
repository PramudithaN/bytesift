# SonarQube / SonarCloud Project Configuration
sonar.host.url=https://sonarcloud.io
sonar.projectKey=PramudithaN_bytesift
sonar.organization=pramudithan
sonar.projectName=bytesift
sonar.projectVersion=0.1.8

# Source & Test paths
sonar.sources=bytesift
sonar.tests=tests

# Encoding and Language specifications
sonar.sourceEncoding=UTF-8
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13, 3.14

# Code Coverage & Reports
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,build/**,dist/**,*.egg-info/**,bytesift/ui/gui.py
